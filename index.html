<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فطن AI - تدقيق عقود العمل الذكي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- مكتبة قراءة ملفات الـ PDF مباشرة من المتصفح -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(23, 31, 48, 0.7);
      --gold: #d4af37;
      --gold-hover: #b59226;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --border: rgba(212, 175, 55, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 70%); }
    .header { text-align: center; margin-bottom: 25px; }
    .logo-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; }
    .logo-icon { background: linear-gradient(135deg, var(--gold), #8a6d1c); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
    h1 { font-size: 28px; font-weight: 700; color: #fff; }
    p.subtitle { color: var(--subtext); font-size: 14px; margin-top: 5px; }
    .badge { display: inline-block; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--border); color: var(--gold); padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-top: 10px; }
    .main-card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 650px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .input-group { margin-bottom: 20px; text-align: right; }
    label { display: block; color: var(--gold); font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    
    /* تصميم زر رفع الملفات */
    .file-dropzone { border: 2px dashed rgba(212, 175, 55, 0.4); background: rgba(11, 15, 25, 0.5); padding: 25px; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 15px; }
    .file-dropzone:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
    .file-dropzone p { color: var(--subtext); font-size: 14px; margin-top: 5px; }
    .file-dropzone input { display: none; }
    #fileNameDisplay { color: var(--gold); font-size: 13px; margin-top: 8px; font-weight: 600; }

    textarea { width: 100%; height: 130px; background: rgba(11, 15, 25, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; color: #fff; font-size: 14px; line-height: 1.6; resize: vertical; }
    textarea:focus { outline: none; border-color: var(--gold); }
    
    .btn { width: 100%; background: linear-gradient(135deg, var(--gold), #a37f20); color: #000; font-weight: 700; font-size: 16px; border: none; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25); display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn:hover { background: linear-gradient(135deg, #e5be44, var(--gold)); transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    #resultContainer { margin-top: 30px; text-align: right; display: none; }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 8px; font-weight: bold; font-size: 14px; margin-bottom: 15px; }
    .status-legal { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-illegal { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .summary-box { background: rgba(255,255,255,0.03); border-right: 3px solid var(--gold); padding: 15px; border-radius: 0 10px 10px 0; margin-bottom: 20px; font-size: 14px; color: #e5e7eb; }
    .violation-card { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 18px; margin-bottom: 15px; }
    .violation-title { color: #f87171; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
    .violation-desc { color: #d1d5db; font-size: 13px; margin-bottom: 10px; line-height: 1.5; }
    .violation-article { font-size: 12px; color: var(--gold); background: rgba(212, 175, 55, 0.1); padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
    .violation-fix { background: rgba(34, 197, 94, 0.08); border-right: 2px solid #22c55e; padding: 10px; border-radius: 0 6px 6px 0; font-size: 13px; color: #86efac; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-container">
      <div class="logo-icon">ف</div>
      <h1>فطن AI</h1>
    </div>
    <p class="subtitle">مدقق عقود العمل الذكي المعتمد - نظام العمل السعودي</p>
    <div class="badge">⚖️ دعم كامل لقراءة ملفات الـ PDF والنصوص</div>
  </div>

  <div class="main-card">
    <div class="input-group">
      <label>رفع ملف العقد (PDF أو TXT) أو اللصق اليدوي:</label>
      
      <!-- منطقة رفع الملفات -->
      <div class="file-dropzone" onclick="document.getElementById('contractFile').click()">
        <span style="font-size: 28px;">📄</span>
        <p>اضغط هنا لاختيار ملف العقد (PDF)</p>
        <input type="file" id="contractFile" accept=".pdf,.txt" onchange="handleFileSelect(event)">
        <div id="fileNameDisplay"></div>
      </div>

      <textarea id="contractInput" placeholder="أو الصق بنود عقد العمل هنا مباشرة للفحص الآلي..."></textarea>
    </div>

    <button id="analyzeBtn" class="btn" onclick="analyzeContract()">
      <span>بدء الفحص والتطابق الآلي</span>
    </button>

    <div id="resultContainer">
      <div id="statusBadge" class="status-badge"></div>
      <div id="summaryText" class="summary-box"></div>
      <div id="violationsList"></div>
    </div>
  </div>

  <script>
    // إعداد قارئ ملفات الـ PDF
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('fileNameDisplay').innerText = '📁 تم اختيار الملف: ' + file.name;
      
      if (file.type === 'application/pdf') {
        const reader = new FileReader();
        reader.onload = async function() {
          const typedarray = new Uint8Array(this.result);
          try {
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const textContent = await page.getTextContent();
              const pageText = textContent.items.map(item => item.str).join(' ');
              fullText += pageText + '\n';
            }
            document.getElementById('contractInput').value = fullText;
          } catch (err) {
            alert('خطأ في قراءة ملف الـ PDF: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      } else if (file.type === 'text/plain') {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('contractInput').value = e.target.result;
        };
        reader.readAsText(file, 'UTF-8');
      } else {
        alert('الرجاء رفع ملف PDF أو نص TXT فقط');
      }
    }

    async function analyzeContract() {
      const text = document.getElementById('contractInput').value;
      const btn = document.getElementById('analyzeBtn');
      const resultContainer = document.getElementById('resultContainer');
      const statusBadge = document.getElementById('statusBadge');
      const summaryText = document.getElementById('summaryText');
      const violationsList = document.getElementById('violationsList');

      if (!text.trim()) {
        alert('يرجى رفع ملف العقد أو كتابة/لصق نصه أولاً.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>جاري قراءة العقد والفحص القانوني...</span>';
      resultContainer.style.display = 'none';

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contractText: text })
        });

        const data = await response.json();

        if (data.error) {
          alert('حدث خطأ أثناء الفحص: ' + data.error);
        } else {
          const isLegal = data.status === "نظامي";
          statusBadge.className = 'status-badge ' + (isLegal ? 'status-legal' : 'status-illegal');
          statusBadge.innerText = 'حالة العقد: ' + data.status;

          summaryText.innerHTML = '<strong>الملخص القانوني:</strong> ' + data.summary;

          violationsList.innerHTML = '';
          if (data.violations && data.violations.length > 0) {
            data.violations.forEach(v => {
              const item = document.createElement('div');
              item.className = 'violation-card';
              item.innerHTML = `
                <div class="violation-title">⚠️ ${v.item}</div>
                <div class="violation-article">المادة المرجعية: ${v.article}</div>
                <div class="violation-desc">${v.issue}</div>
                <div class="violation-fix"><strong>التعديل المقترح:</strong> ${v.suggestedClause}</div>
              `;
              violationsList.appendChild(item);
            });
          } else {
            violationsList.innerHTML = '<div style="color:#4ade80; text-align:center; padding:15px;">✅ لم يتم العثور على أي مخالفات صريحة لنظام العمل السعودي.</div>';
          }
          resultContainer.style.display = 'block';
        }
      } catch (err) {
        alert('حدث خطأ في الاتصال بالخادم: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>بدء الفحص والتطابق الآلي</span>';
      }
    }
  </script>
</body>
</html>
