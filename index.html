<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فطن AI | المدقق القانوني الذكي لعقود العمل</title>
<meta name="description" content="فطن AI - مساعد ذكي لتحليل عقود العمل ومراجعتها وفق نظام العمل السعودي.">
<meta name="theme-color" content="#0a0e17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0a0e17;--bg2:#0f1524;--card:#131a2b;--card2:#18213a;
  --gold:#d4af37;--gold2:#f0d477;--text:#f3f4f6;--muted:#9aa3b5;
  --line:rgba(255,255,255,.08);--border:rgba(212,175,55,.22);
  --green:#4ade80;--amber:#fbbf24;--red:#f87171;--blue:#93c5fd;--gray:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);padding:0 16px 50px;
  background:
    radial-gradient(900px 420px at 50% -80px,rgba(212,175,55,.16),transparent 70%),
    radial-gradient(600px 300px at 100% 40%,rgba(59,130,246,.06),transparent 70%),
    var(--bg);
}
.container{width:100%;max-width:880px;margin:auto}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.brand{display:flex;align-items:center;gap:12px}
.logo-icon{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold2),#9b7619);color:#111;font-size:25px;font-weight:700;
  box-shadow:0 6px 24px rgba(212,175,55,.25)
}
.brand h1{font-size:22px;font-weight:700;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.pill{
  padding:6px 13px;border:1px solid var(--border);color:var(--gold2);
  background:rgba(212,175,55,.07);border-radius:30px;font-size:12px
}

/* Hero */
.hero{text-align:center;padding:26px 0 30px}
.hero h2{font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.5}
.hero h2 span{background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:15px;margin-top:10px;line-height:1.9}
.features{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.feature{font-size:12px;color:var(--muted);padding:6px 12px;border-radius:30px;background:rgba(255,255,255,.04);border:1px solid var(--line)}

/* Cards */
.card{
  background:linear-gradient(180deg,rgba(24,33,58,.7),rgba(19,26,43,.92));
  border:1px solid var(--border);border-radius:22px;padding:28px;margin-bottom:20px;
  box-shadow:0 18px 55px rgba(0,0,0,.32)
}
.section-title{display:flex;align-items:center;gap:10px;color:var(--gold2);font-size:17px;font-weight:700;margin-bottom:16px}
.step{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;
  background:rgba(212,175,55,.15);border:1px solid var(--border);color:var(--gold2)
}

/* Dropzone */
.dropzone{
  border:2px dashed rgba(212,175,55,.4);border-radius:16px;background:rgba(10,14,23,.55);
  padding:30px 18px;text-align:center;cursor:pointer;transition:.2s
}
.dropzone:hover,.dropzone.dragover,.dropzone:focus-visible{border-color:var(--gold);background:rgba(212,175,55,.06);outline:none}
.dropzone .ico{font-size:36px;margin-bottom:8px}
.dropzone strong{display:block;font-size:15px}
.dropzone p{color:var(--muted);font-size:12px;margin-top:8px}
#contractFile{display:none}
.file-info{
  display:none;margin-top:12px;padding:12px 14px;background:rgba(212,175,55,.07);
  border:1px solid var(--border);border-radius:12px;color:var(--gold2);font-size:13px;overflow-wrap:anywhere
}
.file-info button{margin-right:10px;background:transparent;border:0;color:var(--red);cursor:pointer;font-size:13px}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}

label{display:block;font-size:14px;font-weight:600;margin-bottom:9px}
textarea{
  width:100%;min-height:200px;resize:vertical;padding:15px;border:1px solid rgba(255,255,255,.13);
  border-radius:14px;background:rgba(10,14,23,.7);color:var(--text);font-size:14px;line-height:1.9;outline:none;transition:.2s
}
textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.meta-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.help{color:var(--muted);font-size:12px;line-height:1.8}
.counter{font-size:12px;color:var(--muted);direction:ltr}
.counter.warn{color:var(--amber)}
.counter.over{color:var(--red);font-weight:700}

.btn{
  width:100%;border:none;border-radius:14px;padding:16px 18px;margin-top:20px;
  background:linear-gradient(135deg,var(--gold2),#ad8520);color:#111;font-size:16px;font-weight:700;
  cursor:pointer;transition:.2s;box-shadow:0 8px 28px rgba(212,175,55,.2)
}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:wait}
.ghost{
  background:transparent;border:1px solid var(--border);color:var(--gold2);padding:9px 15px;
  border-radius:10px;cursor:pointer;font-size:13px;transition:.2s
}
.ghost:hover{background:rgba(212,175,55,.08)}

/* Progress */
.progress-wrap{display:none;margin-top:18px}
.progress-message{color:var(--muted);font-size:13px;margin-bottom:9px}
.progress-track{width:100%;height:5px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
.progress-bar{height:100%;width:35%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:10px;animation:loading 1.2s infinite alternate ease-in-out}
@keyframes loading{from{width:12%;margin-right:0}to{width:90%}}

.notice{display:none;padding:13px 15px;margin-top:16px;border-radius:12px;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.notice.error{display:block;color:#fecaca;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28)}
.notice.success{display:block;color:#bbf7d0;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.22)}

/* Results */
#resultContainer{display:none}
.result-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{transition:stroke-dashoffset 1s ease}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:34px;line-height:1}
.ring .num span{font-size:11px;color:var(--muted);margin-top:4px}
.result-head{flex:1;min-width:220px}
.result-head h2{font-size:20px;margin-bottom:10px}
.risk{display:inline-block;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid}
.risk.low{color:var(--green);background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3)}
.risk.medium{color:var(--amber);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3)}
.risk.high{color:var(--red);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}
.risk.unknown{color:var(--gray);background:rgba(148,163,184,.1);border-color:rgba(148,163,184,.3)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{font-size:12px;color:var(--muted);padding:5px 11px;border-radius:30px;background:rgba(255,255,255,.04);border:1px solid var(--line)}

.summary{
  border-right:3px solid var(--gold);background:rgba(255,255,255,.035);padding:17px 18px;
  border-radius:0 12px 12px 0;line-height:2;font-size:14px;margin-bottom:24px;white-space:pre-wrap;overflow-wrap:anywhere
}
.block{margin-top:26px}
.block h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.block h3 .count{font-size:12px;color:var(--muted);font-weight:500}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.info{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.info small{display:block;color:var(--gold2);font-size:12px;font-weight:700;margin-bottom:4px}
.info div{font-size:13px;line-height:1.7;overflow-wrap:anywhere}

.issue{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;border-right:4px solid var(--gray)}
.issue.high{border-right-color:var(--red)}
.issue.medium{border-right-color:var(--amber)}
.issue.low{border-right-color:var(--blue)}
.issue-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.issue-head h4{font-size:15px;line-height:1.7}
.sev{flex:none;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid}
.sev.high{color:var(--red);border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.1)}
.sev.medium{color:var(--amber);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.1)}
.sev.low{color:var(--blue);border-color:rgba(147,197,253,.35);background:rgba(59,130,246,.1)}
.field{margin-top:12px;line-height:1.9;font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.field-label{display:block;color:var(--gold2);font-weight:700;margin-bottom:3px}
.quote{padding:10px 12px;background:rgba(255,255,255,.04);border-right:2px solid var(--muted);border-radius:0 8px 8px 0;color:#d1d5db;font-style:normal}
.fix{padding:12px;background:rgba(34,197,94,.06);border-right:2px solid var(--green);border-radius:0 8px 8px 0;color:#bbf7d0}

.list{list-style:none;display:grid;gap:8px}
.list li{position:relative;padding:11px 40px 11px 14px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;font-size:13px;line-height:1.9;overflow-wrap:anywhere}
.list li::before{position:absolute;right:14px;top:11px;font-size:14px}
.list.missing li::before{content:"⚠️"}
.list.good li::before{content:"✅"}
.list.rec li::before{content:"💡"}
.empty-state{text-align:center;padding:18px;border-radius:12px;color:var(--green);background:rgba(34,197,94,.06);line-height:1.9;font-size:13px}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.legal-disclaimer{color:var(--muted);font-size:12px;line-height:1.9;margin-
